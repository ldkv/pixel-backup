services:
  pixel-backup:
    build: .
    container_name: pixel_backup
    restart: unless-stopped
    ports:
      - ${API_PORT:-8000}:8000
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data # Must match the mount target below, not overridable via .env
    volumes:
      - ${DATA_ROOT}:${DATA_ROOT} # Must be parent of syncthing dir - DO NOT mount syncthing dir separately
      - ${LOCAL_DATA_DIR}:/data
      - /etc/localtime:/etc/localtime:ro

  syncthing:
    image: syncthing/syncthing:2.0.16
    container_name: syncthing
    restart: unless-stopped
    volumes:
      - ${SYNCTHING_DIR:-/mnt/media/syncthing}:/syncthing
      - syncthing_config:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8384:8384" # GUI
      - "22000:22000/tcp"
      - "22000:22000/udp"

volumes:
  syncthing_config:
