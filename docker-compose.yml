services:
  pixel-backup:
    build: .
    container_name: pixel_backup
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - USER_CONFIGS=/app/configs/users.json
    volumes:
      - ${DATA_ROOT:-/immich}:${DATA_ROOT:-/immich} # Must be parent of syncthing volume
      - ./configs:/app/configs
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8000:8000" # History API (/status, /history/<username>)

  syncthing:
    image: syncthing/syncthing:2.0.16
    container_name: syncthing
    restart: unless-stopped
    volumes:
      - ${SYNCTHING_DIR:-/immich/syncthing}:/syncthing
      - syncthing_config:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8384:8384" # GUI
      - "22000:22000/tcp"
      - "22000:22000/udp"

volumes:
  syncthing_config:
