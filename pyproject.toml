[project]
name = "immich-backup"
version = "0.1.0"
description = "Automatically backup immich assets to Google Photos using Syncthing."
readme = "README.md"
authors = [{ name = "Vu LE", email = "ledkvu@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["croniter==6.0.0", "pydantic==2.12.5"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.2", "ty==0.0.18"]

[project.scripts]
immich-backup = "immich_backup.main:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 120
