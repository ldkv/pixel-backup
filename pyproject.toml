[project]
name = "pixel-backup"
version = "0.5.3"
description = "Automatically backup local media library to Google Pixel via Syncthing."
authors = [{ name = "Vu LE", email = "ledkvu@gmail.com" }]
requires-python = "==3.15.2"
dependencies = [
    "croniter==7.0.0",
    "django-bolt==0.13.0",
    "pydantic-settings==2.16.3",
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.2",
    "pyrefly==1.5.0",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false
exclude-newer = "3 days"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "C",
    "Q",
    "B",
    "A",
    "PL",
    "I",
    "RET",
    "ANN20",
    "ANN00",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "PLR2004", # Allow magic values in tests
]

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pixel_backup.settings"

[tool.pyrefly]
project-includes = ["**/*.py*"]
preset = "default"
