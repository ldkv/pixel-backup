[project]
name = "pixel-backup"
version = "0.4.0"
description = "Automatically backup local media library to Google Pixel via Syncthing."
authors = [{ name = "Vu LE", email = "ledkvu@gmail.com" }]
requires-python = "==3.14.7"
dependencies = [
    "croniter==6.2.4",
    "django-bolt==0.11.1",
    "pydantic-settings==2.15.0",
    "tzdata==2026.4",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.7",
    "ty==0.0.83",
]

[tool.uv]
package = false
exclude-newer = "3 days"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "C",
    "Q",
    "B",
    "A",
    "PL",
    "I",
    "RET",
    "ANN20",
    "ANN00",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "PLR2004", # Allow magic values in tests
]

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pixel_backup.settings"
