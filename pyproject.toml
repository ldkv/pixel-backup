[project]
name = "pixel-backup"
version = "0.1.0"
description = "Automatically backup local media library to Google Pixel via Syncthing."
authors = [{ name = "Vu LE", email = "ledkvu@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "croniter==6.2.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "tzdata==2026.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "ty==0.0.79"]

[tool.uv]
exclude-newer = "3 days"


[project.scripts]
pixel-backup = "pixel_backup.main:main"

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["PLR2004", "PLR0913"]
select = ["E4", "E7", "E9", "F", "C", "Q", "B", "A", "PL", "I", "RET"]

[tool.ruff.lint.mccabe]
max-complexity = 10
