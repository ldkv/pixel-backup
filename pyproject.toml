[project]
name = "immich-backup"
version = "0.1.0"
description = "Automatically backup immich assets to Google Photos using Syncthing."
readme = "README.md"
authors = [{ name = "Vu LE", email = "ledkvu@gmail.com" }]
requires-python = "==3.14.3"
dependencies = ["pydantic-settings==2.13.1", "requests==2.32.5"]


[dependency-groups]
dev = ["ruff==0.15.2", "ty==0.0.18"]

[project.scripts]
immich-backup = "immich_backup:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
