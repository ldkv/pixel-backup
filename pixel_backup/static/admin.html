<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Backup Admin</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="container">
  <div>
    <h1>Pixel Backup Admin</h1>
    <p class="subtitle">Manage synced users, trigger syncs, and review recent batches.</p>
  </div>

  <div class="card">
    <h2>Sync</h2>
    <div class="sync-row">
      <button id="sync-btn">Trigger Sync Now</button>
      <label class="checkbox">
        <input type="checkbox" id="dry-run-checkbox">
        Dry run
      </label>
      <span id="sync-status" class="status-msg"></span>
    </div>
  </div>

  <div class="card">
    <h2>Global Config</h2>
    <form class="add-form" id="global-config-form">
      <div class="field">
        <label for="gc-syncthing-dir">Syncthing Dir</label>
        <input id="gc-syncthing-dir" data-field="syncthing_dir">
      </div>
      <div class="field">
        <label for="gc-phone-limit-gb">Phone Limit (GB)</label>
        <input id="gc-phone-limit-gb" data-field="phone_limit_gb" type="number" step="any" min="0" required>
      </div>
      <div class="field">
        <label for="gc-stop-threshold-mb">Stop Threshold (MB)</label>
        <input id="gc-stop-threshold-mb" data-field="stop_threshold_mb" type="number" min="0" required>
      </div>
      <div class="field">
        <label for="gc-cron-schedule">Cron Schedule</label>
        <input id="gc-cron-schedule" data-field="cron_schedule" required>
      </div>
      <div class="field">
        <label for="gc-cron-timezone">Cron Timezone</label>
        <input id="gc-cron-timezone" data-field="cron_timezone" required>
      </div>
      <div class="field">
        <label for="gc-min-sleep-seconds">Min Sleep (s)</label>
        <input id="gc-min-sleep-seconds" data-field="min_sleep_seconds" type="number" required>
      </div>
      <div class="field">
        <label for="gc-discord-webhook-url">Discord Webhook URL</label>
        <input id="gc-discord-webhook-url" data-field="discord_webhook_url">
      </div>
      <button type="submit">Save</button>
      <span id="global-config-status" class="status-msg"></span>
    </form>
  </div>

  <div class="card">
    <h2>User Configs</h2>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Source Dir</th>
          <th>Sync Order</th>
          <th>Cutoff</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="user-configs-body"></tbody>
    </table>
    <form class="add-form" id="add-user-config-form">
      <div class="field">
        <label for="uc-username">Username</label>
        <input id="uc-username" required>
      </div>
      <div class="field">
        <label for="uc-source-dir">Source Dir</label>
        <input id="uc-source-dir" required>
      </div>
      <div class="field">
        <label for="uc-sync-order">Sync Order</label>
        <input id="uc-sync-order" type="number" required style="width: 90px;">
      </div>
      <button type="submit">Add</button>
      <span id="add-user-config-status" class="status-msg"></span>
    </form>
  </div>

  <div class="card">
    <div class="batches-header">
      <h2>Batches</h2>
      <select class="filter-select" id="batches-user-filter">
        <option value="">All users</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Files</th>
          <th>Size</th>
          <th>Synced At</th>
        </tr>
      </thead>
      <tbody id="batches-body"></tbody>
    </table>
  </div>
</div>

<script src="/static/admin.js"></script>
</body>
</html>
