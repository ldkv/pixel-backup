version: "3"

tasks:
  default: task help

  help:
    desc: show help message
    cmd: task --list-all

  install-uv:
    desc: Install uv if not found
    status:
      - uv -V
    cmds:
      - echo "uv not found, installing..."
      - curl -LsSf https://astral.sh/uv/install.sh | sh

  tree:
    desc: Show the project dependency tree with outdated packages and sizes
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - uv tree --outdated --show-sizes

  dev-install:
    desc: Install all dependencies including dev, extras
    dir: "{{.USER_WORKING_DIR}}"
    deps: [install-uv]
    cmds:
      - uv venv --clear
      - uv sync

  dependencies-check:
    desc: Check the dependencies are up to date
    cmds:
      - uv lock --check

  format-check:
    desc: Verify code formatting
    cmds:
      - uv run ruff format --check .

  format:
    desc: Format code
    cmds:
      - uv run ruff format .

  lint-check:
    desc: Verify code linting
    cmds:
      - uv run ruff check .

  lint-fix:
    desc: Apply linting fixes to codebase - use with caution
    cmds:
      - uv run ruff check --fix .

  type-check:
    desc: Run the type checker
    cmd: uv run ty check

  code-quality:
    desc: Run the linters and static type checker
    deps: [format-check, lint-check, type-check]

  test:
    desc: Run the tests in local environment
    cmds:
      - uv run pytest .

  check-all:
    desc: Run all checks and tests
    deps: [dependencies-check, code-quality, test]

  down:
    desc: Stop the application with docker compose
    cmd: docker compose down

  up:
    desc: Start the application with docker compose
    deps: [down]
    cmd: docker compose up -d --build

  push:
    desc: Push the application to docker registry
    cmds:
      - docker build -t git.ledkvu.com/ldkv/pixel-backup:latest .
      - docker push git.ledkvu.com/ldkv/pixel-backup:latest

  bump:
    desc: Bump the package version, e.g. 'task bump level=minor'
    requires:
      vars:
        - name: level
          enum: [patch, minor, major]
    cmds:
      - uv version --bump {{.level}}

  bump-pr:
    desc: Bump the version and create a pull request, e.g. 'task bump-pr level=minor'
    deps: [bump]
    cmds:
      - |
        set -euo pipefail
        NEW_VERSION=$(uv version --short)
        BRANCH_NAME="bump-version-$NEW_VERSION"
        git checkout -b "$BRANCH_NAME"
        git add pyproject.toml uv.lock
        git commit -m "chore: bump version to $NEW_VERSION"
        git push --set-upstream origin "$BRANCH_NAME"
        gh pr create --title "chore: bump version to $NEW_VERSION" --body "Automated version bump via task." --base main
